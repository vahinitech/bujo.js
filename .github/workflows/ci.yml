name: CI Pipeline

on:
  # Docs-only changes (README/CLAUDE.md/docs/**) skip this whole pipeline --
  # nothing here builds or tests markdown. A push/PR that touches even one
  # non-doc file still runs everything; paths-ignore only fires when EVERY
  # changed file matches. (commitlint.yml is intentionally NOT filtered --
  # it's cheap and checks the commit message, not file contents.)
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0           # Ensure full history for semantic-release
          persist-credentials: true # Allow semantic-release to push tags

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Lint Commit Messages
        run: npx commitlint --from=HEAD~1 --to=HEAD

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0           # Ensure full history for tag push
          persist-credentials: true # Allow semantic-release to push

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
